[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coral-reef-diving-rag"
version = "0.1.0"
description = "Traceable hybrid RAG prototype for Taiwan coral-reef snorkeling and scuba-diving research"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
coral-rag = "coral_rag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
