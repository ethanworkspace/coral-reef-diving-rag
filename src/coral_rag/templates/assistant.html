<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>研究問答（非生成式）</title>
  <link rel="stylesheet" href="/static/assistant.css">
  <script src="/static/assistant.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#assistant-form">跳到研究問答</a>
  <header class="page-header"><div><p class="eyebrow">本機研究工具</p><h1>研究問答（非生成式）</h1><p>本頁不使用生成式模型；結果只由既有資料與安全規則組成。</p></div><nav aria-label="頁面導覽"><a href="/">首頁</a><a href="/map">潛點地圖</a><a href="/knowledge">海洋保育知識</a></nav></header>
  <main>
    <section class="notice"><h2>使用限制</h2><p>本頁不取代專業判斷、官方公告、訓練、醫療建議或現場評估。結果不是下水、合法性或安全判定。</p></section>
    <form id="assistant-form" class="query-card">
      <label for="question">研究問題</label><textarea id="question" maxlength="500" required aria-describedby="question-help"></textarea><p id="question-help">輸入保育、潛點基本資料、附近歷史 eDNA、行政區天氣或官方公告相關問題。</p>
      <label for="site">潛點（需要時主動選擇）</label><select id="site"><option value="">不選擇潛點</option></select>
      <label for="radius">eDNA 查詢半徑（需要時主動選擇）</label><select id="radius"><option value="">不查詢 eDNA</option><option value="250">250 公尺</option><option value="500">500 公尺</option><option value="1000">1,000 公尺</option><option value="2500">2,500 公尺</option><option value="5000">5,000 公尺</option></select>
      <label for="weather-range">天氣時間範圍（需要時主動選擇）</label><select id="weather-range"><option value="">不查詢天氣</option><option value="24">未來 24 小時</option><option value="48">未來 48 小時</option><option value="72">未來 72 小時</option></select>
      <button type="submit">查詢研究證據</button>
    </form>
    <section id="assistant-status" role="status" aria-live="polite">尚未查詢；不會保存問題或結果。</section>
    <section id="assistant-result" hidden aria-live="polite"><p id="result-label" class="label"></p><h2 id="result-heading">研究結果</h2><p id="result-message"></p><div id="records" class="records"></div><div id="citations" class="citations"></div><div id="links" class="citations"></div><section class="limitations"><h3>資料限制</h3><ul id="limitations"></ul></section></section>
  </main>
</body>
</html>
