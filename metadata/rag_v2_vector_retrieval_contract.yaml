acceptance_criteria:
  hard_quality_gates:
    target_holdout_cross_language_hit_at_3: 0.70
    target_holdout_cross_language_mrr_at_3: 0.50
    target_chunk_embedding_coverage_ratio: 1.0
  recorded_performance_metrics:
    latency_evaluation_policy: "latency_p50_p95_measured_only"
    record_fields:
      - "indexing_latency_per_chunk_seconds_p50"
      - "indexing_latency_per_chunk_seconds_p95"
      - "query_latency_seconds_p50"
      - "query_latency_seconds_p95"
    policy_rationale: "推論延遲取決於實際運行的 CPU/GPU 與量化格式，採觀測記錄 (measured) 方式評估，不作硬性阻絕門檻，避免因純硬體差異導致檢索模型遭誤判失敗"
  note_on_fts5_baseline: "FTS5 在 Task 10 達成的 100% 命中是同語言詞彙導向與精確關鍵字重合的 baseline，不可被當成跨語言泛化證據。多語向量檢索的唯一目的在於跨越中英文無共享字詞的語意鴻溝（如 holdout 測試集所驗證）。"
