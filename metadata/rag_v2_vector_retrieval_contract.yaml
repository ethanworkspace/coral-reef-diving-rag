    license: "MIT（官方模型卡已確認 MIT 授權，允許商業與學術離線使用）"
    model_size_or_disk_estimate: "約 2.2 GB (FP16)"
    embedding_dimension: 1024
    CPU/GPU compatibility: "相容 CPU 與 CUDA GPU；在 RTX 4050 (6GB VRAM) 可執行，CPU fallback 可行"
