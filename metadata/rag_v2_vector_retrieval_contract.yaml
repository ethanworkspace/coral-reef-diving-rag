version: "1.0.0"
contract_id: "rag_v2_vector_retrieval_contract"
established_at: "2026-09-23T18:15:00+08:00"
updated_at: "2026-09-23T18:25:00+08:00"

default_policies:
  single_model_policy: "embedding 文件與查詢必須使用同一個本機多語模型"
  zero_translation_policy: "文件中英文原文不翻譯，直接使用多語向量模型本體之跨語言語意投影空間"
  hybrid_parallel_policy: "向量檢索與現有 FTS5 並行雙軌運作，未來採分數融合，絕不取代 FTS 詞彙檢索"
  allow_external_embedding: false
  external_embedding_governance: "預設禁止將 chunks 傳送到外部 embedding API；若未來啟用外部 embedding，必須是獨立設定、明確使用者同意且不得為預設值"

execution_boundaries:
  command_separation: "下載與建庫指令嚴格分離。'download-rag-v2-embedding-model --confirm-download' 為唯一允許對 Hugging Face 進行模型下載的命令；'build-rag-v2-dense'、'search-rag-v2-dense'、'evaluate-rag-v2-dense' 必須在完全離線環境下執行（local_files_only=True、HF_HUB_OFFLINE=1），若模型檔案缺失或不完整必須 fail-closed，絕不得隱蔽發起網路請求"
  gpu_best_effort: "CUDA GPU 加速僅為效能最佳化，不得作為系統功能前提。建庫時動態實測 torch.cuda.is_available() 與可用 VRAM；若無法使用或發生 OOM，必須自動優雅降級為 CPU 執行並在 Manifest 記錄降級原因"
  provenance_manifest_depth: "Manifest 必須記錄完整模型來源（repository、精確 revision SHA、license、下載時間戳記）、每個模型檔案之相對路徑、檔案大小（bytes）與 SHA-256 雜湊，以及執行環境之實際套件版本與 pip check 依賴一致性驗證結果"
  dependency_constraint_nature: "requirements-vector.txt 作為頂層版本約束（version constraints）管理主要套件版本，非完整凍結所有遞迴依賴之 lockfile"

model_selection_rules:
  licensing_and_locality: "只能選具明確開放授權（如 MIT、Apache-2.0）、可完全離線本機執行、且具備繁中與英文跨語言語意對齊評測實證的 embedding 模型"
  hardware_fallback: "GPU 不可用時，必須保留 CPU 可行方案，限制批次大小（CPU batch_size <= 4 或 8），並可採 INT8/ONNX 量化加速"
  resource_exhaustion_defense: "若本機運算資源不足或環境依賴無法滿足，Task 12 必須 fail-closed，嚴禁未經授權隱蔽切換至雲端 API"
  task_boundary: "全程最多下載一個經官方模型卡複驗核准之模型，禁止下載多個模型重複比較"

